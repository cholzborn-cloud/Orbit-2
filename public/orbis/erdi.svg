<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-label="Erdi" style="--dbga-t:1;--dbga-p:running;"><defs><clipPath id="cp1"><circle cx="50" cy="50" r="34" /></clipPath></defs><g ><g class="dbga-hop" style="animation-delay:-4.7s"><circle cx="50" cy="50" r="34" fill="#6d9ee3"/><g clip-path="url(#cp1)"><ellipse cx="36" cy="30" rx="11" ry="6" fill="#4fae6a" opacity=".9"/><ellipse cx="68" cy="75" rx="13" ry="7" fill="#4fae6a" opacity=".9"/><ellipse cx="28" cy="74" rx="6" ry="3.5" fill="#4fae6a" opacity=".9"/></g><g class="dbga-look" style="animation-delay:-4.7s"><g transform="translate(20 46)"><g transform="translate(9.5)"><g class="dbga-eye"><circle cx="8" cy="8" r="7" fill="#fff"/><g class="dbga-pupil"><circle cx="8" cy="8" r="3.5" fill="#0f172a"/></g></g></g><g transform="translate(34.5)"><g class="dbga-eye"><circle cx="8" cy="8" r="7" fill="#fff"/><g class="dbga-pupil"><circle cx="8" cy="8" r="3.5" fill="#0f172a"/></g></g></g></g></g></g></g><style>@media (prefers-reduced-motion:no-preference){@keyframes dbgaLook{0%,16%{transform:translate(0,0)}24%,38%{transform:translate(-3.6px,.9px)}46%,60%{transform:translate(3.4px,-.7px)}68%,82%{transform:translate(.7px,1.7px)}90%,100%{transform:translate(0,0)}}@keyframes dbgaBlink{0%,94%,97%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.06)}}@keyframes dbgaHop{0%,58%,100%{transform:translateY(0) scale(1,1)}64%{transform:translateY(0) scale(1.06,.94)}73%{transform:translateY(-4px) scale(.96,1.05)}82%{transform:translateY(0) scale(1.05,.95)}90%{transform:translateY(0) scale(.99,1.01)}}@keyframes dbgaPupil{0%,12%{transform:translate(0,0)}22%,40%{transform:translate(1.6px,-.8px)}50%,66%{transform:translate(-1.6px,.8px)}76%,100%{transform:translate(0,0)}}@keyframes dbgaSpin{to{transform:rotate(360deg)}}.dbga-pupil,.dbga-spin{transform-box:fill-box;transform-origin:center}.dbga-pupil{animation:dbgaPupil calc(var(--dbga-t,1)*3.9s) ease-in-out infinite;animation-play-state:var(--dbga-p,paused)}.dbga-spin{animation:dbgaSpin calc(var(--dbga-t,1)*40s) linear infinite;animation-play-state:var(--dbga-p,paused)}.dbga-eye,.dbga-look{transform-box:fill-box;transform-origin:center}.dbga-hop{transform-box:fill-box;transform-origin:50% 100%}.dbga-look{animation:dbgaLook calc(var(--dbga-t,1)*6.4s) ease-in-out infinite}.dbga-eye{animation:dbgaBlink calc(var(--dbga-t,1)*4.4s) linear infinite}.dbga-hop{animation:dbgaHop calc(var(--dbga-t,1)*5.2s) ease-out infinite}.dbga-eye,.dbga-look,.dbga-hop{animation-play-state:var(--dbga-p,paused)}}</style></svg>